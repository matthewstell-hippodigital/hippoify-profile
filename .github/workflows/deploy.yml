name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/test.yml

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Collect the site files
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='test/' \
            --exclude='.gitignore' \
            --exclude='package.json' \
            --exclude='PLAN.md' \
            --exclude='README.md' \
            ./ _site/

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v5

      - name: Deploy the artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
